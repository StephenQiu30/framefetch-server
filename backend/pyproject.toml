[project]
name = "video-server-backend"
version = "0.2.0"
description = "Backend runtime for the universal video downloader"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "aio-pika>=9.5,<10",
  "asyncpg>=0.30,<1",
  "bgutil-ytdlp-pot-provider==1.3.2",
  "cryptography>=45,<47",
  "fastapi>=0.139,<1",
  "httpx>=0.28,<1",
  "langchain-deepseek==1.1.0",
  "langchain-openai>=1.1.9,<2",
  "minio>=7.2,<8",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.3,<1",
  "PyJWT>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=16.1,<17",
  "yt-dlp[default,curl-cffi] @ https://github.com/yt-dlp/yt-dlp/archive/3a08beaf031ab68f966401ead017ac81fe8486cf.tar.gz",
  "python-docx>=1.2,<2",
  "markdown-it-py>=4,<5",
  "PyYAML>=6.0,<7",
  "pypdf==6.16.0",
  "botocore>=1.40,<2",
  "redis>=6.4,<7",
  "pillow>=12,<13",
  "tldextract>=5.3,<6",
]

[dependency-groups]
# Only the session-browser image installs Playwright and its Chromium.
browser = ["playwright==1.63.0"]
dev = [
  { include-group = "browser" },
  "botocore-stubs>=1.40,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
