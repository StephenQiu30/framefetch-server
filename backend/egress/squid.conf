# The proxy is only attached to the Compose network. It accepts Docker-local
# clients and still blocks private or literal destination URLs below.
acl docker_clients src 10.0.0.0/8
acl docker_clients src 172.16.0.0/12
acl docker_clients src 192.168.0.0/16

acl cookie_source_host dstdomain host.docker.internal
acl cookie_source_port port 19101
acl cookie_source_method method POST
acl cookie_source_path urlpath_regex ^/cookies$

acl safe_ports port 80
acl safe_ports port 443
acl safe_ports port 4483
acl safe_ports port 8082
acl safe_ports port 8889
acl ssl_ports port 443
acl ssl_ports port 4483
acl ssl_ports port 8082
acl ssl_ports port 8889
acl connect method CONNECT

# Bilibili signs public media URLs on its own and partner CDN TLS endpoints.
# Keep the non-standard ports scoped to those CDNs instead of opening them for
# every host.
acl bilibili_media dstdom_regex -i \.(bilivideo\.(cn|com)|mountaintoys\.cn)$
acl bilibili_media_port port 4483 8082
# Observed public Douyin cold-media redirects from *.douyinvod.com use this
# CDN on TLS port 8889. Do not open that port for arbitrary destinations.
acl douyin_cold_media dstdomain .wmzfylgdsz.com
acl douyin_cold_media_port port 8889
acl docker_desktop_web_port port 80 443

include /etc/squid/policy/blocked-destinations.conf

acl blocked_name dstdomain localhost .local .localdomain .internal .home.arpa
acl ip_literal_url url_regex -i ^https?://[0-9]+(\.[0-9]+){3}([:/]|$)
acl ip_literal_url url_regex -i ^https?://\[
acl ip_literal_url url_regex -i ^[0-9]+(\.[0-9]+){3}:
acl ip_literal_url url_regex -i ^\[

http_access deny !docker_clients
http_access deny ip_literal_url
http_access allow docker_clients cookie_source_host cookie_source_port cookie_source_method cookie_source_path
http_access deny cookie_source_host
http_access deny !safe_ports
http_access deny connect !ssl_ports
http_access deny bilibili_media_port !bilibili_media
http_access deny douyin_cold_media_port !douyin_cold_media
http_access deny blocked_name
# Docker Desktop answers public DNS through configured synthetic IP ranges.
# Other private ranges remain blocked_destination.
http_access allow docker_clients bilibili_media_port bilibili_media docker_desktop_synthetic_dns
http_access allow docker_clients douyin_cold_media_port douyin_cold_media docker_desktop_synthetic_dns
http_access allow docker_clients docker_desktop_web_port docker_desktop_synthetic_dns
http_access deny blocked_destination
http_access allow docker_clients
http_access deny all

http_port 3128 name=cn_residential
http_port 3129 name=global_residential
hosts_file /tmp/identity-hosts
include /tmp/egress-routes.conf
cache deny all
access_log none
cache_log stdio:/dev/stderr
cache_store_log none
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
request_header_access Cache-Control deny all
pid_filename /tmp/squid.pid
coredump_dir /tmp

# Identity material must never reach an upstream proxy. Logs contain no headers/body.
always_direct allow cookie_source_host cookie_source_port
