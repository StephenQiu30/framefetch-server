<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FrameFetch</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header><h1>FrameFetch</h1><span id="version"></span></header>
      <dl>
        <div><dt>宿主连接</dt><dd id="connection">正在检查…</dd></div>
        <div><dt>元宝登录材料</dt><dd id="session">正在检查…</dd></div>
      </dl>
      <p id="message" role="status" aria-live="polite">正在检查插件状态。</p>
      <p class="hint">视频号解析直接在插件内部完成，无需打开元宝页面。登录过期时，请完成元宝登录后重试。</p>
      <div class="actions">
        <button id="login-yuanbao" type="button">登录元宝</button>
        <button id="refresh" type="button" class="secondary">刷新状态</button>
        <button id="reconnect" type="button" class="secondary" hidden>重新连接</button>
      </div>
    </main>
  </body>
</html>
