<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>帧取 Chrome 会话</title>
<link rel="stylesheet" href="popup.css">
<main><h1>复用 Chrome 登录</h1><p>仅在解析任务需要时读取对应平台的登录状态。</p>
<p id="status" role="status" aria-live="polite">正在检查连接…</p>
<button id="connect">重新连接</button><p>会话不会保存到帧取数据库。退出平台登录后，后续任务会读取最新状态。</p></main>
<script src="popup.js"></script></html>
