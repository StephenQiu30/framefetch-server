name: 功能建议
description: 为 FrameFetch 服务端、Web 或 AI 分析提出可验证的改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FrameFetch 以 workspace/content/design/README.md 为设计基线交付。请先描述用户问题与价值；移动端交互建议请提交到 video-app。

  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到什么问题？不要只写实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、关键状态与完成标准。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明尝试过的现有流程或其他选择。

  - type: checkboxes
    id: checks
    attributes:
      label: 范围确认
      options:
        - label: 此建议不会要求绕过 DRM、会员权限、平台访问控制或安全边界。
          required: true
