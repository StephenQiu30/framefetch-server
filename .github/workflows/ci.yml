name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: video
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -U video -d video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://video:video@127.0.0.1:5432/video
      TEST_TEMPORAL_START_LOCAL: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Configure supported Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        with:
          version: v5.5.1
      - name: Install backend integration test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server redis-tools ffmpeg
          command -v redis-server
          command -v redis-cli
          command -v ffmpeg
          command -v ffprobe
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --dev
      - name: Check backend format and lint
        working-directory: backend
        run: |
          uv run --frozen ruff check app tests
          uv run --frozen ruff format --check app tests
      - name: Check backend types
        working-directory: backend
        run: uv run --frozen mypy app
      - name: Test backend
        working-directory: backend
        run: uv run --frozen pytest -q -rs

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
      - name: Configure pnpm and dependency cache
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "12.4.2"
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export OpenAPI from backend annotations
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run --frozen python -c 'import json, os; from pathlib import Path; from app.core.config import Settings; from app.main import create_app; Path(os.environ["RUNNER_TEMP"], "framefetch-openapi.json").write_text(json.dumps(create_app(Settings(app_env="test")).openapi()))'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify generated OpenAPI client
        working-directory: frontend
        run: OPENAPI_SCHEMA_URL="$RUNNER_TEMP/framefetch-openapi.json" pnpm openapi:check
      - name: Check frontend format and lint
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm lint
      - name: Test frontend
        working-directory: frontend
        run: pnpm test
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
      - name: Test identity extension
        run: |
          node --test extension/*.test.cjs
      - name: Check documentation links
        run: node backend/scripts/check_docs.mjs
