name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: video
          POSTGRES_USER: video
          POSTGRES_PASSWORD: video
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -U video -d video"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://video:video@127.0.0.1:5432/video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Redis lease test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server redis-tools
          command -v redis-server
          command -v redis-cli
      - name: Test backend
        working-directory: backend
        run: |
          uv sync --frozen --dev
          uv run --frozen ruff check app tests
          uv run --frozen ruff format --check app tests
          uv run --frozen mypy app
          uv run --frozen pytest -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
      - name: Use repository pnpm version
        run: npm install --global pnpm@12.4.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Export OpenAPI from backend annotations
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run --frozen python -c 'import json, os; from pathlib import Path; from app.core.config import Settings; from app.main import create_app; Path(os.environ["RUNNER_TEMP"], "framefetch-openapi.json").write_text(json.dumps(create_app(Settings(app_env="test")).openapi()))'
      - name: Test frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          OPENAPI_SCHEMA_URL="$RUNNER_TEMP/framefetch-openapi.json" pnpm openapi:check
          pnpm format:check
          pnpm lint
          pnpm test
          pnpm build
