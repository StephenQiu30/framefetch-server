name: framefetch-env

# Standalone PostgreSQL, RabbitMQ, Redis and MinIO provisioning.
# Start explicitly only when those services are not already provided.
# Business services use docker-compose.yml; Temporal is provided separately.

services:
  postgres:
    image: postgres:18
    container_name: framefetch-env-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-video}"
      POSTGRES_USER: "${POSTGRES_USER:-video}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-video}"
    ports:
      - "127.0.0.1:${HOST_POSTGRES_PORT:-15432}:5432"
    volumes:
      - video_env_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: framefetch-env-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-video}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-video}"
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "127.0.0.1:${HOST_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${HOST_RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - video_env_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq-init:
    image: rabbitmq:3.13-management-alpine
    container_name: framefetch-env-rabbitmq-init
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-video}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-video}"
      RABBITMQ_VHOST: "${RABBITMQ_VHOST:-video}"
      RABBITMQ_API_USER: "${RABBITMQ_API_USER:-video-api}"
      RABBITMQ_API_PASS: "${RABBITMQ_API_PASS:-video-api-secret}"
      RABBITMQ_WORKER_USER: "${RABBITMQ_WORKER_USER:-video-worker}"
      RABBITMQ_WORKER_PASS: "${RABBITMQ_WORKER_PASS:-video-worker-secret}"
      RABBITMQ_DLQ_USER: "${RABBITMQ_DLQ_USER:-video-dlq}"
      RABBITMQ_DLQ_PASS: "${RABBITMQ_DLQ_PASS:-video-dlq-secret}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        admin="rabbitmqadmin --host rabbitmq --port 15672 --username $${RABBITMQ_DEFAULT_USER} --password $${RABBITMQ_DEFAULT_PASS}"
        until $$admin --vhost=/ list vhosts >/dev/null 2>&1; do sleep 2; done
        $$admin --vhost=/ declare vhost name="$${RABBITMQ_VHOST}"
        declare_user() {
          $$admin --vhost=/ declare user name="$$1" password="$$2" tags=none
          $$admin --vhost=/ declare permission vhost="$${RABBITMQ_VHOST}" user="$$1" configure='.*' write='.*' read='.*'
        }
        declare_user "$${RABBITMQ_API_USER}" "$${RABBITMQ_API_PASS}"
        declare_user "$${RABBITMQ_WORKER_USER}" "$${RABBITMQ_WORKER_PASS}"
        declare_user "$${RABBITMQ_DLQ_USER}" "$${RABBITMQ_DLQ_PASS}"

  redis:
    image: redis:8-alpine
    container_name: framefetch-env-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${HOST_REDIS_PORT:-16380}:6379"
    volumes:
      - video_env_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: framefetch-env-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minio123}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_CORS_ALLOWED_ORIGINS-http://127.0.0.1:8101,http://localhost:8101}"
    command: ["minio", "server", "/data", "--address", ":9000", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${HOST_MINIO_PORT:-19190}:9000"
      - "127.0.0.1:${HOST_MINIO_CONSOLE_PORT:-19191}:9001"
    volumes:
      - video_env_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: framefetch-env-minio-init
    restart: "no"
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
          mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" >/dev/null &&
          mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
          printf 'ready\n' |
          mc pipe "local/$${MINIO_BUCKET}/system/analysis-readiness" >/dev/null

volumes:
  video_env_postgres_data:
  video_env_rabbitmq_data:
  video_env_redis_data:
  video_env_minio_data:
