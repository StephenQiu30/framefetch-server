      ANALYSIS_REPORT_MAX_BYTES: '${ANALYSIS_REPORT_MAX_BYTES:-16777216}'
      ANALYSIS_REPORT_ORPHAN_GRACE_SECONDS: '${ANALYSIS_REPORT_ORPHAN_GRACE_SECONDS:-3600}'
