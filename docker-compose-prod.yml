name: framefetch
services:
  migrate:
    extends:
      file: docker-compose-common.yml
      service: migrate
    image: framefetch:prod
    environment:
      APP_ENV: ${APP_ENV:-production}
  api:
    extends:
      file: docker-compose-common.yml
      service: api
    image: framefetch:prod
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
    - ${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-8111}:8111
  frontend:
    extends:
      file: docker-compose-common.yml
      service: frontend
    build:
      args:
        SITE_URL: ${SITE_URL:?SITE_URL is required}
    image: framefetch-frontend:prod
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:?SITE_URL is required}
    ports:
    - ${APP_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-8101}:8101
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:8101/'', {redirect: ''manual''}).then((response) => process.exit(response.status >= 200
        && response.status < 400 ? 0 : 1)).catch(() => process.exit(1))'
    working_dir: /app/frontend/.next/standalone
    command:
    - node
    - server.js
  worker:
    extends:
      file: docker-compose-common.yml
      service: worker
    image: framefetch:prod
    environment:
      APP_ENV: ${APP_ENV:-production}
  egress-proxy:
    extends:
      file: docker-compose-common.yml
      service: egress-proxy
  session-runner:
    extends:
      file: docker-compose-common.yml
      service: session-runner
    image: framefetch:prod
    environment:
      APP_ENV: ${APP_ENV:-production}
  youtube-pot-provider:
    extends:
      file: docker-compose-common.yml
      service: youtube-pot-provider
volumes:
  runner_work:
    name: ${RUNNER_WORK_VOLUME_NAME:-video-server_runner_work}
  browser_profiles:
    name: ${BROWSER_PROFILES_VOLUME_NAME:-video-server_browser_profiles}
networks:
  app_net:
    ipam:
      config:
      - subnet: ${APP_NETWORK_SUBNET:-10.251.0.0/24}
        ip_range: ${APP_NETWORK_IP_RANGE:-10.251.0.128/25}
  runner_egress_net:
    internal: true
  youtube_pot_net:
    internal: true
  proxy_uplink_net: null
