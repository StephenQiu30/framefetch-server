      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: '${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-10}'
      RABBITMQ_RECONNECT_INTERVAL_SECONDS: '${RABBITMQ_RECONNECT_INTERVAL_SECONDS:-5}'
      RABBITMQ_VHOST: '${RABBITMQ_VHOST:-video}'
      WORKER_PREFETCH: '${WORKER_PREFETCH:-2}'
