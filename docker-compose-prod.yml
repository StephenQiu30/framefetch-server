  provider-canary:
    build: *backend-build
    image: video-server:prod
    container_name: video-provider-canary
    restart: unless-stopped
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_VERSION: '${APP_VERSION:-0.2.0}'
      DOWNLOAD_TIMEOUT_SECONDS: '${DOWNLOAD_TIMEOUT_SECONDS:-7200}'
      INSPECT_TIMEOUT_SECONDS: '${INSPECT_TIMEOUT_SECONDS:-150}'
      MAX_FILE_SIZE_BYTES: '${MAX_FILE_SIZE_BYTES:-21474836480}'
      MAX_VIDEO_DURATION_SECONDS: '${MAX_VIDEO_DURATION_SECONDS:-86400}'
      MAX_WORKSPACE_SIZE_BYTES: '${MAX_WORKSPACE_SIZE_BYTES:-42949672960}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:-video-access}'
      MINIO_REGION: '${MINIO_REGION:-us-east-1}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:-video-secret-change-me}'
      PEERTUBE_ALLOWED_INSTANCES: '${PEERTUBE_ALLOWED_INSTANCES:-[]}'
      PROVIDER_CANARY_MEDIA_INTERVAL_SECONDS: '${PROVIDER_CANARY_MEDIA_INTERVAL_SECONDS:-86400}'
      PROVIDER_CANARY_METADATA_INTERVAL_SECONDS: '${PROVIDER_CANARY_METADATA_INTERVAL_SECONDS:-21600}'
      PROVIDER_CANARY_POLL_SECONDS: '${PROVIDER_CANARY_POLL_SECONDS:-60}'
      PROVIDER_CANARY_TARGETS: '${PROVIDER_CANARY_TARGETS:-[]}'
      RUNNER_HMAC_SECRET: '${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}'
      SESSION_RUNNER_BASE_URL: http://session-runner:19100
      RUNNER_SIGNATURE_TTL_SECONDS: '${RUNNER_SIGNATURE_TTL_SECONDS:-30}'
      URL_ENCRYPTION_KEY: '${URL_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtdXJsLWtleS0zMi1ieXRlcyEhISE=}'
      URL_ENCRYPTION_KEY_ID: '${URL_ENCRYPTION_KEY_ID:-fernet}'
      SERVICE_ROLE: provider-canary
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    volumes:
      - runner_work:/work
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.canary.main"]

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    container_name: egress-proxy
    restart: unless-stopped
    stop_grace_period: 35s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    entrypoint: ["squid"]
    command: ["-N", "-f", "/etc/squid/policy/squid.conf"]
    ports:
      - "127.0.0.1:${EGRESS_PROXY_HOST_PORT:-13128}:3128"
    volumes:
      # Mount the directory, not single files: a git checkout or editor save
      # replaces the file, and a single-file bind mount keeps the old inode.
      - ./backend/egress:/etc/squid/policy:ro
    networks:
      - runner_egress_net
      - youtube_pot_net
      - proxy_uplink_net
    healthcheck:
      # Compose does not recreate this container when only the bind-mounted
      # policy changes, and Squid never rereads it on its own. Reload a changed
      # policy after it parses; a policy that fails to parse keeps the running
      # one and marks the proxy unhealthy.
      test:
        - CMD-SHELL
        - >-
          m=/tmp/squid-policy-loaded;
          [ -e "$$m" ] || touch -r /proc/1 "$$m" || exit 1;
          if [ -n "$$(find /etc/squid/policy -name '*.conf' -newer "$$m")" ]; then
          touch "$$m.next" &&
          squid -k parse -f /etc/squid/policy/squid.conf >/dev/null 2>&1 &&
          squid -k reconfigure -f /etc/squid/policy/squid.conf &&
          mv "$$m.next" "$$m" || exit 1;
          fi;
          squid -k check -f /etc/squid/policy/squid.conf
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  provider-lease-redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: provider-lease-redis
    restart: unless-stopped
    read_only: true
    user: "999:1000"
    entrypoint: ["redis-server"]
    command: ["--save", "", "--appendonly", "no"]
    networks:
      - runner_rpc_net
    cap_drop: [ALL]
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,mode=0700,uid=999,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # 046: the broker is the only holder of SITE_SESSION_ENCRYPTION_KEY; it never
  # reaches the Internet. The browser owns per-site profiles and has no database.
  session-broker:
    build: *backend-build
    image: video-server:prod
    container_name: session-broker
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app_net, session_net, runner_rpc_net]
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      SERVICE_ROLE: session-broker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      SITE_SESSION_ENCRYPTION_KEY: "${SITE_SESSION_ENCRYPTION_KEY:-}"
      SITE_SESSION_RPC_SECRET: "${SITE_SESSION_RPC_SECRET:?SITE_SESSION_RPC_SECRET is required}"
      SITE_SESSION_BROWSER_SECRET: "${SITE_SESSION_BROWSER_SECRET:?SITE_SESSION_BROWSER_SECRET is required}"
      SITE_SESSION_BROWSER_URL: http://session-browser:19300
    depends_on:
      session-browser:
        condition: service_healthy
    command: ["python", "-m", "app.workers.session.broker_app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19200/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  session-browser:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: session-browser
    image: video-session-browser:prod
    container_name: session-browser
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 512m
    networks: [session_net, runner_egress_net]
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /home/appuser:rw,nosuid,size=64m,uid=10001,gid=10001
    environment:
      SITE_SESSION_BROWSER_SECRET: "${SITE_SESSION_BROWSER_SECRET:?SITE_SESSION_BROWSER_SECRET is required}"
      SITE_SESSION_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
    volumes:
      - site_session_profiles:/profiles
    depends_on:
      egress-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19300/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  workspace-init:
    build: *backend-build
    image: video-server:prod
    container_name: workspace-init
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0700 /work"]
    volumes:
      - runner_work:/work

  # One Runner for every site session (046): per-task leases from the broker,
  # one operation per site across replicas through provider-lease-redis.
  session-runner:
    <<: *provider-session-runner
    container_name: session-runner
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *provider-session-environment
      RUNNER_MAX_ACTIVE_TASKS: "${SESSION_RUNNER_MAX_ACTIVE_TASKS:-4}"
      RUNNER_SESSION_BROKER_URL: http://session-broker:19200
      RUNNER_SESSION_RPC_SECRET: "${SITE_SESSION_RPC_SECRET:?SITE_SESSION_RPC_SECRET is required}"
      RUNNER_YOUTUBE_POT_BASE_URL: http://youtube-pot-provider:4416
      RUNNER_YOUTUBE_POT_PROVIDER_VERSION: bgutil-http-1.3.2
    networks:
      - runner_rpc_net
      - runner_egress_net
      - youtube_pot_net
    volumes:
      - runner_work:/work
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
      provider-lease-redis:
        condition: service_healthy
      youtube-pot-provider:
        condition: service_healthy
      session-broker:
        condition: service_healthy

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2@sha256:9a96e6385ce1928da87dea07b1cab0413d2cf8c07a3b8a8bd419f53df2c3843c
    container_name: youtube-pot-provider
    restart: unless-stopped
    read_only: true
    entrypoint:
      ["/usr/local/bin/node", "/opt/video/youtube-pot-supervisor.mjs"]
    healthcheck:
      test:
        ["CMD", "/usr/local/bin/node", "/opt/video/youtube-pot-supervisor.mjs", "--check-identity"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      YOUTUBE_POT_EXPECTED_VERSION: "1.3.2"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
    networks:
      - youtube_pot_net
    volumes:
      - type: bind
        source: ./backend/app/workers/runner/youtube-pot-supervisor.mjs
        target: /opt/video/youtube-pot-supervisor.mjs
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  site_session_profiles:
  runner_work:

networks:
  app_net:
    ipam:
      config:
        - subnet: "${APP_NETWORK_SUBNET:-10.251.0.0/24}"
          ip_range: "${APP_NETWORK_IP_RANGE:-10.251.0.128/25}"
  runner_rpc_net:
    internal: true
  runner_egress_net:
    internal: true
  session_net:
    internal: true
  youtube_pot_net:
    internal: true
  proxy_uplink_net:
