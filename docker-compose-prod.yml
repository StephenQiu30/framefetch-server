x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-provider-session-runner: &provider-session-runner
  build: *backend-build
  image: video-server:prod
  restart: unless-stopped
  stop_grace_period: 90s
  networks:
    - runner_rpc_net
    - runner_egress_net
  extra_hosts:
    - "host.docker.internal:host-gateway"
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /run/provider-session:rw,noexec,nosuid,size=16m,mode=0700,uid=10001,gid=10001
  depends_on:
    egress-proxy:
      condition: service_healthy
    provider-lease-redis:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19100/health/runtime', timeout=3)",
      ]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 5s
  command:
    [
      "python",
      "-m",
      "uvicorn",
      "app.workers.runner.main:create_app",
      "--factory",
      "--host",
      "0.0.0.0",
      "--port",
      "19100",
      "--no-access-log",
    ]

x-provider-session-environment: &provider-session-environment
  APP_ENV: "${APP_ENV:-production}"
  RUNNER_HMAC_SECRET: "${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}"
  RUNNER_EGRESS_PROXY: http://egress-proxy:3128
  RUNNER_PROVIDER_EGRESS_PROXIES: "${RUNNER_PROVIDER_EGRESS_PROXIES:-{}}"
  RUNNER_WORKSPACE_ROOT: /work
  RUNNER_ACCESS_MODE: operator_managed
  RUNNER_CREDENTIAL_LEASE_REDIS_URL: redis://provider-lease-redis:6379/0
  RUNNER_CREDENTIAL_LEASE_TTL_SECONDS: "${RUNNER_CREDENTIAL_LEASE_TTL_SECONDS:-120}"
  RUNNER_CREDENTIAL_LEASE_HEARTBEAT_SECONDS: "${RUNNER_CREDENTIAL_LEASE_HEARTBEAT_SECONDS:-30}"
  RUNNER_MAX_ACTIVE_TASKS: "1"
  RUNNER_DOWNLOAD_TIMEOUT_SECONDS: "${RUNNER_DOWNLOAD_TIMEOUT_SECONDS:-7200}"
  RUNNER_INSPECT_TIMEOUT_SECONDS: "${RUNNER_INSPECT_TIMEOUT_SECONDS:-120}"
  RUNNER_MAX_DURATION_SECONDS: "${RUNNER_MAX_DURATION_SECONDS:-86400}"
  RUNNER_MAX_OUTPUT_BYTES: "${RUNNER_MAX_OUTPUT_BYTES:-21474836480}"
  RUNNER_MAX_WORKSPACE_BYTES: "${RUNNER_MAX_WORKSPACE_BYTES:-42949672960}"
  RUNNER_PROVIDER_SESSION_TEMP_ROOT: /run/provider-session
  PEERTUBE_ALLOWED_INSTANCES: "${PEERTUBE_ALLOWED_INSTANCES:-[]}"

services:
  api:
    build: *backend-build
    image: video-server:prod
    container_name: video-api
    restart: unless-stopped
    environment:
      ANALYSIS_ENABLED: '${ANALYSIS_ENABLED:-false}'
      ANALYSIS_MANUAL_RETRIES_PER_DAY: '${ANALYSIS_MANUAL_RETRIES_PER_DAY:-20}'
      ANALYSIS_MANUAL_RETRY_MIN_INTERVAL_SECONDS: '${ANALYSIS_MANUAL_RETRY_MIN_INTERVAL_SECONDS:-30}'
      ANALYSIS_MAX_RUNS_PER_JOB: '${ANALYSIS_MAX_RUNS_PER_JOB:-10}'
      ANALYSIS_QUEUE: '${ANALYSIS_QUEUE:-video.analysis}'
      ANALYSIS_REPORT_MAX_BYTES: '${ANALYSIS_REPORT_MAX_BYTES:-16777216}'
      ANALYSIS_REPORT_QUEUE: '${ANALYSIS_REPORT_QUEUE:-video.analysis-report}'
      ANALYSIS_REPORT_ROUTING_KEY: '${ANALYSIS_REPORT_ROUTING_KEY:-analysis.report.publish.requested}'
      ANALYSIS_ROUTING_KEY: '${ANALYSIS_ROUTING_KEY:-analysis.requested}'
      ANALYSIS_WORKER_STALE_SECONDS: '${ANALYSIS_WORKER_STALE_SECONDS:-45}'
      APP_ENV: '${APP_ENV:-production}'
      APP_VERSION: '${APP_VERSION:-0.2.0}'
      ARTICLE_DISCOVERY_MAX_ITEMS: '${ARTICLE_DISCOVERY_MAX_ITEMS:-24}'
      ARTICLE_DISCOVERY_MAX_RESPONSE_BYTES: '${ARTICLE_DISCOVERY_MAX_RESPONSE_BYTES:-4194304}'
      ARTICLE_DISCOVERY_MIN_INTERVAL_SECONDS: '${ARTICLE_DISCOVERY_MIN_INTERVAL_SECONDS:-1}'
      ARTICLE_DISCOVERY_TIMEOUT_SECONDS: '${ARTICLE_DISCOVERY_TIMEOUT_SECONDS:-12}'
      ARTICLE_DISCOVERY_TTL_SECONDS: '${ARTICLE_DISCOVERY_TTL_SECONDS:-900}'
      ARTIFACT_DELETE_TIMEOUT_SECONDS: '${ARTIFACT_DELETE_TIMEOUT_SECONDS:-30}'
      ARTIFACT_DOWNLOAD_URL_TTL_SECONDS: '${ARTIFACT_DOWNLOAD_URL_TTL_SECONDS:-300}'
      SMTP_ENABLED: '${SMTP_ENABLED:-false}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_TLS_MODE: '${SMTP_TLS_MODE:-starttls}'
      SMTP_USERNAME: '${SMTP_USERNAME:-}'
      SMTP_PASSWORD: '${SMTP_PASSWORD:-}'
      SMTP_FROM_EMAIL: '${SMTP_FROM_EMAIL:-}'
      SMTP_FROM_NAME: '${SMTP_FROM_NAME:-帧取}'
      AUTH_WEB_COOKIE_NAME: '${AUTH_WEB_COOKIE_NAME:-video_web_session}'
      AUTH_WEB_IDLE_TTL_SECONDS: '${AUTH_WEB_IDLE_TTL_SECONDS:-604800}'
      AUTH_WEB_ABSOLUTE_TTL_SECONDS: '${AUTH_WEB_ABSOLUTE_TTL_SECONDS:-2592000}'
      AUTH_ACCESS_TOKEN_TTL_SECONDS: '${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}'
      AUTH_BOOTSTRAP_ADMIN_EMAIL: '${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}'
      AUTH_BOOTSTRAP_ADMIN_SECRET: '${AUTH_BOOTSTRAP_ADMIN_SECRET:-development-admin-bootstrap-secret-change-me}'
      AUTH_JWT_AUDIENCE: '${AUTH_JWT_AUDIENCE:-video-web}'
      AUTH_JWT_ISSUER: '${AUTH_JWT_ISSUER:-video-server}'
      AUTH_JWT_SECRET: '${AUTH_JWT_SECRET:-development-jwt-secret-change-me-32-bytes}'
      AUTH_REFRESH_TOKEN_TTL_SECONDS: '${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}'
      DOCUMENT_IMPORT_ENABLED: '${DOCUMENT_IMPORT_ENABLED:-true}'
      DOCUMENT_IMPORT_MAX_BYTES: '${DOCUMENT_IMPORT_MAX_BYTES:-52428800}'
      DOCUMENT_NORMALIZED_MAX_CHARACTERS: '${DOCUMENT_NORMALIZED_MAX_CHARACTERS:-2000000}'
      DOCUMENT_PREVIEW_MAX_BYTES: '${DOCUMENT_PREVIEW_MAX_BYTES:-1048576}'
      DOCUMENT_PREVIEW_MAX_CHARACTERS: '${DOCUMENT_PREVIEW_MAX_CHARACTERS:-1000000}'
      DOWNLOAD_QUEUE: '${DOWNLOAD_QUEUE:-video.download}'
      DOWNLOAD_ROUTING_KEY: '${DOWNLOAD_ROUTING_KEY:-download.requested}'
      DOWNLOAD_THUMBNAIL_MAX_BYTES: '${DOWNLOAD_THUMBNAIL_MAX_BYTES:-2000000}'
      DOWNLOAD_TIMEOUT_SECONDS: '${DOWNLOAD_TIMEOUT_SECONDS:-7200}'
      IMPORT_QUEUE: '${IMPORT_QUEUE:-video.import}'
      IMPORT_RIGHTS_STATEMENT_VERSION: '${IMPORT_RIGHTS_STATEMENT_VERSION:-content-rights}'
      IMPORT_ROUTING_KEY: '${IMPORT_ROUTING_KEY:-content.import.verify.requested}'
      IMPORT_UPLOAD_MAX_CONCURRENCY: '${IMPORT_UPLOAD_MAX_CONCURRENCY:-4}'
      IMPORT_UPLOAD_MAX_PARTS: '${IMPORT_UPLOAD_MAX_PARTS:-1000}'
      IMPORT_UPLOAD_PART_SIZE_BYTES: '${IMPORT_UPLOAD_PART_SIZE_BYTES:-33554432}'
      IMPORT_UPLOAD_SESSION_TTL_SECONDS: '${IMPORT_UPLOAD_SESSION_TTL_SECONDS:-900}'
      INSPECT_TIMEOUT_SECONDS: '${INSPECT_TIMEOUT_SECONDS:-150}'
      INSPECTION_TTL_SECONDS: '${INSPECTION_TTL_SECONDS:-900}'
      MAX_ANALYSIS_ATTEMPTS: '${MAX_ANALYSIS_ATTEMPTS:-3}'
      MAX_DOWNLOAD_ATTEMPTS: '${MAX_DOWNLOAD_ATTEMPTS:-3}'
      MAX_FILE_SIZE_BYTES: '${MAX_FILE_SIZE_BYTES:-21474836480}'
      MAX_VIDEO_DURATION_SECONDS: '${MAX_VIDEO_DURATION_SECONDS:-86400}'
      MAX_WORKSPACE_SIZE_BYTES: '${MAX_WORKSPACE_SIZE_BYTES:-42949672960}'
      MEDIA_IMPORT_ENABLED: '${MEDIA_IMPORT_ENABLED:-true}'
      MEDIA_IMPORT_MAX_BYTES: '${MEDIA_IMPORT_MAX_BYTES:-2147483648}'
      METRICS_ACCESS_KEY: '${METRICS_ACCESS_KEY:-development-metrics-access-key-change-me}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:-video-access}'
      MINIO_PUBLIC_SECURE: '${MINIO_PUBLIC_SECURE:-false}'
      MINIO_REGION: '${MINIO_REGION:-us-east-1}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:-video-secret-change-me}'
      PEERTUBE_ALLOWED_INSTANCES: '${PEERTUBE_ALLOWED_INSTANCES:-[]}'
      PROVIDER_VERIFIED_KEYS: '${PROVIDER_VERIFIED_KEYS:-[]}'
      QUOTA_LIMITS: '${QUOTA_LIMITS:-{"max_active_per_owner":5,"daily_tasks":50,"daily_bytes":107374182400,"storage_bytes":107374182400,"daily_analysis_attempts":60}}'
      RABBITMQ_CONNECTION_TIMEOUT_SECONDS: '${RABBITMQ_CONNECTION_TIMEOUT_SECONDS:-10}'
      RABBITMQ_EXCHANGE: '${RABBITMQ_EXCHANGE:-video.events}'
      RABBITMQ_HEARTBEAT_SECONDS: '${RABBITMQ_HEARTBEAT_SECONDS:-60}'
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: '${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-10}'
      RABBITMQ_RECONNECT_INTERVAL_SECONDS: '${RABBITMQ_RECONNECT_INTERVAL_SECONDS:-5}'
      RABBITMQ_VHOST: '${RABBITMQ_VHOST:-video}'
      RATE_LIMIT_POLICIES: '${RATE_LIMIT_POLICIES:-{}}'
      READINESS_TIMEOUT_SECONDS: '${READINESS_TIMEOUT_SECONDS:-2.0}'
      REQUEST_FINGERPRINT_SECRET: '${REQUEST_FINGERPRINT_SECRET:-development-fingerprint-secret-change-me}'
      REQUEST_MAX_BYTES: '${REQUEST_MAX_BYTES:-262144}'
      REQUEST_TIMEOUT_SECONDS: '${REQUEST_TIMEOUT_SECONDS:-180}'
      RUNNER_HMAC_SECRET: '${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}'
      SESSION_RUNNER_BASE_URL: http://session-runner:19100
      RUNNER_SIGNATURE_TTL_SECONDS: '${RUNNER_SIGNATURE_TTL_SECONDS:-30}'
      SCREENPLAY_ANALYSIS_ENABLED: '${SCREENPLAY_ANALYSIS_ENABLED:-false}'
      URL_ENCRYPTION_KEY: '${URL_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtdXJsLWtleS0zMi1ieXRlcyEhISE=}'
      URL_ENCRYPTION_KEY_ID: '${URL_ENCRYPTION_KEY_ID:-fernet}'
      WEBSOCKET_AUTH_RECHECK_SECONDS: '${WEBSOCKET_AUTH_RECHECK_SECONDS:-15}'
      WEBSOCKET_MAX_CONNECTIONS: '${WEBSOCKET_MAX_CONNECTIONS:-1000}'
      WEBSOCKET_MAX_CONNECTIONS_PER_OWNER: '${WEBSOCKET_MAX_CONNECTIONS_PER_OWNER:-4}'
      SERVICE_ROLE: api
      APP_HOST: 0.0.0.0
      APP_PORT: 8111
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-[]}'
      TRUSTED_FRONTEND_PROXY_IP: '${FRONTEND_IPV4_ADDRESS:-10.251.0.10}'
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_API_USER:-video-api}:${RABBITMQ_API_PASS:-video-api-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      REDIS_URL: "redis://${REDIS_HOST:-host.docker.internal}:${REDIS_PORT:-6379}/0"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
      MINIO_LOCAL_BROWSER_ENDPOINT: "${MINIO_LOCAL_BROWSER_ENDPOINT:-}"
      MINIO_LOCAL_BROWSER_SECURE: "${MINIO_LOCAL_BROWSER_SECURE:-false}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
      ARTICLE_DISCOVERY_PROXY_URL: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
      - runner_egress_net
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${APP_HOST_PORT:-8111}:8111"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8111/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: ["python", "-m", "app.main"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SITE_URL: "${SITE_URL:?SITE_URL is required}"
        SITE_INDEXABLE: "${SITE_INDEXABLE:-false}"
    image: video-frontend:prod
    container_name: video-frontend
    restart: unless-stopped
    environment:
      AUTH_WEB_COOKIE_NAME: '${AUTH_WEB_COOKIE_NAME:-video_web_session}'
      BACKEND_ORIGIN: http://api:8111
      HOSTNAME: 0.0.0.0
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:19190}"
      MINIO_PUBLIC_SECURE: "${MINIO_PUBLIC_SECURE:-false}"
      MINIO_LOCAL_BROWSER_ENDPOINT: "${MINIO_LOCAL_BROWSER_ENDPOINT:-}"
      MINIO_LOCAL_BROWSER_SECURE: "${MINIO_LOCAL_BROWSER_SECURE:-false}"
      NODE_ENV: production
      PORT: 8101
      SITE_URL: "${SITE_URL:?SITE_URL is required}"
      SITE_INDEXABLE: "${SITE_INDEXABLE:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      app_net:
        ipv4_address: "${FRONTEND_IPV4_ADDRESS:-10.251.0.10}"
    ports:
      - "${APP_HOST_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-8101}:8101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8101/', {redirect: 'manual'}).then((response) => process.exit(response.status >= 200 && response.status < 400 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    working_dir: /app/frontend/.next/standalone
    command: ["node", "server.js"]

  outbox:
    build: *backend-build
    image: video-server:prod
    container_name: video-outbox
    restart: unless-stopped
    environment:
      ANALYSIS_QUEUE: '${ANALYSIS_QUEUE:-video.analysis}'
      ANALYSIS_REPORT_QUEUE: '${ANALYSIS_REPORT_QUEUE:-video.analysis-report}'
      ANALYSIS_REPORT_ROUTING_KEY: '${ANALYSIS_REPORT_ROUTING_KEY:-analysis.report.publish.requested}'
      ANALYSIS_ROUTING_KEY: '${ANALYSIS_ROUTING_KEY:-analysis.requested}'
      APP_ENV: '${APP_ENV:-production}'
      APP_VERSION: '${APP_VERSION:-0.2.0}'
      DOWNLOAD_QUEUE: '${DOWNLOAD_QUEUE:-video.download}'
      DOWNLOAD_ROUTING_KEY: '${DOWNLOAD_ROUTING_KEY:-download.requested}'
      IMPORT_QUEUE: '${IMPORT_QUEUE:-video.import}'
      IMPORT_ROUTING_KEY: '${IMPORT_ROUTING_KEY:-content.import.verify.requested}'
      OUTBOX_BATCH_SIZE: '${OUTBOX_BATCH_SIZE:-50}'
      OUTBOX_POLL_INTERVAL_SECONDS: '${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}'
      OPERATION_LOG_RETENTION_DAYS: '${OPERATION_LOG_RETENTION_DAYS:-180}'
      OPERATION_LOG_PURGE_INTERVAL_SECONDS: '${OPERATION_LOG_PURGE_INTERVAL_SECONDS:-3600}'
      OPERATION_LOG_PURGE_BATCH_SIZE: '${OPERATION_LOG_PURGE_BATCH_SIZE:-5000}'
      RABBITMQ_CONNECTION_TIMEOUT_SECONDS: '${RABBITMQ_CONNECTION_TIMEOUT_SECONDS:-10}'
      RABBITMQ_EXCHANGE: '${RABBITMQ_EXCHANGE:-video.events}'
      RABBITMQ_HEARTBEAT_SECONDS: '${RABBITMQ_HEARTBEAT_SECONDS:-60}'
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: '${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-10}'
      RABBITMQ_RECONNECT_INTERVAL_SECONDS: '${RABBITMQ_RECONNECT_INTERVAL_SECONDS:-5}'
      RABBITMQ_VHOST: '${RABBITMQ_VHOST:-video}'
      SERVICE_ROLE: outbox
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_OUTBOX_USER:-video-outbox}:${RABBITMQ_OUTBOX_PASS:-video-outbox-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    command: ["python", "-m", "app.workers.outbox.main"]

  worker-download:
    build: *backend-build
    image: video-server:prod
    container_name: video-worker-download
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      ANALYSIS_QUEUE: '${ANALYSIS_QUEUE:-video.analysis}'
      ANALYSIS_REPORT_QUEUE: '${ANALYSIS_REPORT_QUEUE:-video.analysis-report}'
      ANALYSIS_REPORT_ROUTING_KEY: '${ANALYSIS_REPORT_ROUTING_KEY:-analysis.report.publish.requested}'
      ANALYSIS_ROUTING_KEY: '${ANALYSIS_ROUTING_KEY:-analysis.requested}'
      APP_ENV: '${APP_ENV:-production}'
      APP_VERSION: '${APP_VERSION:-0.2.0}'
      DOWNLOAD_QUEUE: '${DOWNLOAD_QUEUE:-video.download}'
      DOWNLOAD_QUEUED_RECOVERY_SECONDS: '${DOWNLOAD_QUEUED_RECOVERY_SECONDS:-60}'
      DOWNLOAD_ROUTING_KEY: '${DOWNLOAD_ROUTING_KEY:-download.requested}'
      DOWNLOAD_THUMBNAIL_FFMPEG_BINARY: '${DOWNLOAD_THUMBNAIL_FFMPEG_BINARY:-ffmpeg}'
      DOWNLOAD_THUMBNAIL_MAX_BYTES: '${DOWNLOAD_THUMBNAIL_MAX_BYTES:-2000000}'
      DOWNLOAD_THUMBNAIL_TIMEOUT_SECONDS: '${DOWNLOAD_THUMBNAIL_TIMEOUT_SECONDS:-15}'
      DOWNLOAD_TIMEOUT_SECONDS: '${DOWNLOAD_TIMEOUT_SECONDS:-7200}'
      DOWNLOAD_WORKER_THREADS: '${DOWNLOAD_WORKER_THREADS:-4}'
      REQUEST_FINGERPRINT_SECRET: '${REQUEST_FINGERPRINT_SECRET:-development-fingerprint-secret-change-me}'
      INSPECTION_TTL_SECONDS: '${INSPECTION_TTL_SECONDS:-900}'
      HEARTBEAT_INTERVAL_SECONDS: '${HEARTBEAT_INTERVAL_SECONDS:-15}'
      IMPORT_QUEUE: '${IMPORT_QUEUE:-video.import}'
      IMPORT_ROUTING_KEY: '${IMPORT_ROUTING_KEY:-content.import.verify.requested}'
      INSPECT_TIMEOUT_SECONDS: '${INSPECT_TIMEOUT_SECONDS:-150}'
      JOB_LEASE_SECONDS: '${JOB_LEASE_SECONDS:-60}'
      MAX_FILE_SIZE_BYTES: '${MAX_FILE_SIZE_BYTES:-21474836480}'
      MAX_VIDEO_DURATION_SECONDS: '${MAX_VIDEO_DURATION_SECONDS:-86400}'
      MAX_WORKSPACE_SIZE_BYTES: '${MAX_WORKSPACE_SIZE_BYTES:-42949672960}'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:-video-access}'
      MINIO_REGION: '${MINIO_REGION:-us-east-1}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:-video-secret-change-me}'
      PEERTUBE_ALLOWED_INSTANCES: '${PEERTUBE_ALLOWED_INSTANCES:-[]}'
      RABBITMQ_CONNECTION_TIMEOUT_SECONDS: '${RABBITMQ_CONNECTION_TIMEOUT_SECONDS:-10}'
      RABBITMQ_EXCHANGE: '${RABBITMQ_EXCHANGE:-video.events}'
      RABBITMQ_HEARTBEAT_SECONDS: '${RABBITMQ_HEARTBEAT_SECONDS:-60}'
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: '${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-10}'
      RABBITMQ_RECONNECT_INTERVAL_SECONDS: '${RABBITMQ_RECONNECT_INTERVAL_SECONDS:-5}'
      RABBITMQ_VHOST: '${RABBITMQ_VHOST:-video}'
      RUNNER_HMAC_SECRET: '${RUNNER_HMAC_SECRET:-development-runner-secret-change-me}'
      SESSION_RUNNER_BASE_URL: http://session-runner:19100
      RUNNER_SIGNATURE_TTL_SECONDS: '${RUNNER_SIGNATURE_TTL_SECONDS:-30}'
      URL_ENCRYPTION_KEY: '${URL_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtdXJsLWtleS0zMi1ieXRlcyEhISE=}'
      URL_ENCRYPTION_KEY_ID: '${URL_ENCRYPTION_KEY_ID:-fernet}'
      SERVICE_ROLE: download-worker
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@${POSTGRES_HOST:-host.docker.internal}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-video}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DOWNLOAD_USER:-video-download}:${RABBITMQ_DOWNLOAD_PASS:-video-download-secret}@${RABBITMQ_HOST:-host.docker.internal}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-video}"
      MINIO_ENDPOINT: "${MINIO_HOST:-host.docker.internal}:${MINIO_PORT:-19190}"
      MINIO_BUCKET: "${MINIO_BUCKET:-video-artifacts}"
      MINIO_INTERNAL_SECURE: "${MINIO_INTERNAL_SECURE:-false}"
      RUNNER_WORKSPACE_ROOT: /work
      RUNNER_EGRESS_PROXY: http://egress-proxy:3128
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
      - runner_rpc_net
    volumes:
      - runner_work:/work
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.download.main"]

  worker-import:
    build: *backend-build
    image: video-server:prod
    container_name: video-worker-import
    restart: unless-stopped
    environment:
      ANALYSIS_QUEUE: '${ANALYSIS_QUEUE:-video.analysis}'
      ANALYSIS_REPORT_QUEUE: '${ANALYSIS_REPORT_QUEUE:-video.analysis-report}'
      ANALYSIS_REPORT_ROUTING_KEY: '${ANALYSIS_REPORT_ROUTING_KEY:-analysis.report.publish.requested}'
      ANALYSIS_ROUTING_KEY: '${ANALYSIS_ROUTING_KEY:-analysis.requested}'
      APP_ENV: '${APP_ENV:-production}'
      APP_VERSION: '${APP_VERSION:-0.2.0}'
      DOCUMENT_IMPORT_MAX_BYTES: '${DOCUMENT_IMPORT_MAX_BYTES:-52428800}'
      DOCUMENT_NORMALIZED_MAX_CHARACTERS: '${DOCUMENT_NORMALIZED_MAX_CHARACTERS:-2000000}'
      DOWNLOAD_QUEUE: '${DOWNLOAD_QUEUE:-video.download}'
