name: framefetch
services:
  migrate:
    extends:
      file: docker-compose-common.yml
      service: migrate
    image: framefetch:local
    environment:
      APP_ENV: ${APP_ENV:-development}
  api:
    extends:
      file: docker-compose-common.yml
      service: api
    develop: &backend-watch
      watch:
      - action: sync+restart
        path: ./backend/app
        target: /app/backend/app
        initial_sync: true
      - action: rebuild
        path: ./backend/pyproject.toml
      - action: rebuild
        path: ./backend/uv.lock
      - action: rebuild
        path: ./backend/Dockerfile
    image: framefetch:local
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
    - 127.0.0.1:${APP_HOST_PORT:-8111}:8111
  frontend:
    extends:
      file: docker-compose-common.yml
      service: frontend
    build:
      target: development
      args:
        SITE_URL: ${SITE_URL:-http://127.0.0.1:8101}
    image: framefetch-frontend:local
    environment:
      NODE_ENV: development
      SITE_URL: ${SITE_URL:-http://127.0.0.1:8101}
    ports:
    - 127.0.0.1:${FRONTEND_HOST_PORT:-8101}:8101
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:8101/logo.svg'', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 :
        1)).catch(() => process.exit(1))'
    develop:
      watch:
      - action: sync
        path: ./frontend
        target: /workspace/frontend
        initial_sync: true
        ignore:
        - node_modules/
        - .next/
        - public/_pagefind/
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - Dockerfile
        - .dockerignore
        - tests/
      - action: rebuild
        path: ./frontend/package.json
      - action: rebuild
        path: ./frontend/pnpm-lock.yaml
      - action: rebuild
        path: ./frontend/pnpm-workspace.yaml
      - action: rebuild
        path: ./frontend/Dockerfile
  worker:
    extends:
      file: docker-compose-common.yml
      service: worker
    develop: *backend-watch
    image: framefetch:local
    environment:
      APP_ENV: ${APP_ENV:-development}
  egress-proxy:
    extends:
      file: docker-compose-common.yml
      service: egress-proxy
  session-runner:
    extends:
      file: docker-compose-common.yml
      service: session-runner
    image: framefetch:local
    develop:
      watch:
      - action: rebuild
        path: ./backend
        ignore:
        - tests/
        - sql/
        - egress/
        - README.md
    environment:
      APP_ENV: ${APP_ENV:-development}
  youtube-pot-provider:
    extends:
      file: docker-compose-common.yml
      service: youtube-pot-provider
volumes:
  runner_work:
    name: ${RUNNER_WORK_VOLUME_NAME:-video-server_runner_work}
  browser_profiles:
    name: ${BROWSER_PROFILES_VOLUME_NAME:-video-server_browser_profiles}
networks:
  app_net:
    ipam:
      config:
      - subnet: ${APP_NETWORK_SUBNET:-10.251.0.0/24}
        ip_range: ${APP_NETWORK_IP_RANGE:-10.251.0.128/25}
  runner_egress_net:
    internal: true
  youtube_pot_net:
    internal: true
  proxy_uplink_net: null
